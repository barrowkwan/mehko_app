# Render Blueprint: free Node web service. Deploys are triggered by GitHub Actions
# (deploy hook) after CI passes, so Render's own auto-deploy is off.
services:
  - type: web
    runtime: node
    name: mehko-app
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      # NEXT_PUBLIC_* are inlined at build time, so they must be set before the first deploy.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      # Email notifications (off until set up). See docs/plans/notif-1-email-notifications.md.
      - key: NOTIFICATIONS_PROVIDER
        value: "off"
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UNSUBSCRIBE_SECRET
        sync: false
      # Shown on /privacy and /terms (build-time). Set real values; see docs/legal-pages.md.
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_OPERATOR_NAME
        sync: false
      # Error monitoring (optional; off until a DSN is set). See docs/monitoring.md.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_AUTH_PROVIDERS
        value: google,facebook,apple
