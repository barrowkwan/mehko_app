name: CI

on:
  push:
    branches: [main]
    # Docs-only changes don't need a test run or a redeploy.
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, unit + DB tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests + tests/db (real migration on in-process Postgres). Integration tests are skipped here.
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Dummy values: the build doesn't contact Supabase.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start Supabase
        # Placeholders satisfy the env() references in config.toml; OAuth isn't exercised in CI.
        env:
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          FACEBOOK_CLIENT_ID: ci
          FACEBOOK_CLIENT_SECRET: ci
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          APPLE_CLIENT_ID: ci
          APPLE_CLIENT_SECRET: ci
        # Retry once: pulling ~10 images on a shared runner occasionally times out or flakes.
        run: |
          for attempt in 1 2; do
            if supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "::warning::supabase start failed (attempt $attempt)"
            docker ps -a || true
            supabase stop --no-backup || true
            sleep 10
          done
          exit 1
      - name: Export Supabase keys
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | sed 's/"//g' > "$RUNNER_TEMP/sb.env"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' "$RUNNER_TEMP/sb.env" | cut -d= -f2-)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' "$RUNNER_TEMP/sb.env" | cut -d= -f2-)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' "$RUNNER_TEMP/sb.env" | cut -d= -f2-)"
          } >> "$GITHUB_ENV"
      - name: Integration tests
        run: npx vitest run tests/integration
        env:
          SUPABASE_INTEGRATION: "1"
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Build the app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - name: Browser end-to-end tests
        run: npx playwright test
        env:
          CRON_SECRET: ci
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
      - name: Supabase logs on failure
        if: failure()
        run: docker ps -a && docker logs supabase_realtime_neighborhood-eats --tail 100 || true

  deploy:
    name: Deploy (Supabase migrations → Render)
    needs: [test, integration]
    # Only on pushes to main, and only once you've set the repo variable DEPLOY_ENABLED=true
    # (see docs/deployment.md). Until then CI just runs the tests.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Apply database migrations to hosted Supabase
        env:
          # Session-pooler connection string (IPv4). GitHub runners have no IPv6, and Supabase's direct
          # db.<ref>.supabase.co host is IPv6-only on the free plan. See docs/deployment.md.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Placeholders: config.toml references these via env(); only the DB is touched here.
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          FACEBOOK_CLIENT_ID: ci
          FACEBOOK_CLIENT_SECRET: ci
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          APPLE_CLIENT_ID: ci
          APPLE_CLIENT_SECRET: ci
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Trigger Render deploy of this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
